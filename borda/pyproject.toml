[project]
name = "patio-borda"
version = "0.1.0"
description = "Agente da caixa de borda: captura, leitor de placas, composição e envio."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.3",
    "patio-contratos",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/borda"]

[tool.uv.sources]
patio-contratos = { workspace = true }
