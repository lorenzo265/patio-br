[project]
name = "patio-contratos"
version = "0.1.0"
description = "Formatos compartilhados entre a borda e a nuvem."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.13.5",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contratos"]
