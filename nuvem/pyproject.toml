[project]
name = "patio-nuvem"
version = "0.1.0"
description = "Aplicação da nuvem: API, painel e módulos do produto."
requires-python = ">=3.12,<3.13"
dependencies = ["patio-contratos"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nuvem"]

[tool.uv.sources]
patio-contratos = { workspace = true }
