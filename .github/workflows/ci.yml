# CI do projeto (T03 do plano do mês 1; SDD seções 6.1 e 7.3).
# Seis verificações independentes, em paralelo:
#   1. verificar: estilo, formato, tipos e testes (o mesmo `uv run tarefas check` de quem desenvolve),
#      com o PostgreSQL de teste dos testes da nuvem
#   2. licencas: toda dependência precisa de licença permissiva (regra do SDD 6.1)
#   3. vulnerabilidades: nenhuma dependência com falha de segurança conhecida
#   4. ambiente: `tarefas up` constrói a API e sobe o ambiente local; migrações e /saude (T04, T07)
#   5. imagens-da-caixa: as imagens do agente, do go2rtc e do simulador montam e sobem (T55,
#      SDD D-66; T62)
#   6. producao: o compose das máquinas da AWS sobe como na homologação (T49, SDD D-73)
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Mesma versão do uv que gerou o uv.lock; mude as duas juntas.
  UV_VERSION: "0.8.17"
  PYTHON_VERSION: "3.12"

# Ações fixadas pelo hash do commit (com a versão no comentário): não mudam por baixo e não
# dependem de tag móvel; a setup-uv nem publica tag "v10", só versões completas.
jobs:
  verificar:
    name: estilo, tipos e testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # O mesmo banco de teste do `tarefas up` (infra/docker-compose.yml): porta 15433.
      postgres-teste:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: patio
          POSTGRES_PASSWORD: patio-local
          POSTGRES_DB: patio_teste
        ports: ["15433:5432"]
        options: >-
          --health-cmd "pg_isready -U patio -d patio_teste"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Instalar o ambiente (exatamente o uv.lock)
        run: uv sync --frozen
      - name: O cliente do PostgreSQL 16 (a cópia do banco, D-74)
        run: |
          command -v pg_dump || { sudo apt-get update && sudo apt-get install -y postgresql-client-16; }
          pg_dump --version
      - name: tarefas check
        env:
          PATIO_EXIGE_PG_DUMP: "1"  # aqui, o teste da cópia de verdade não pode ser pulado
        run: uv run tarefas check

  licencas:
    name: licenças das dependências
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Instalar o ambiente (exatamente o uv.lock)
        run: uv sync --frozen
      - name: Só licenças permitidas
        # Permitidas: MIT, BSD, Apache, ISC, PSF, PostgreSQL; MPL-2.0 só para biblioteca usada
        # sem modificação. Qualquer outra (GPL, LGPL, AGPL, desconhecida) reprova.
        # Os pacotes do próprio projeto (patio-*) ficam de fora: são o nosso código.
        run: >-
          uv run --with pip-licenses==5.5.5 pip-licenses
          --from=mixed
          --partial-match
          --allow-only="MIT;BSD;Apache;ISC;PSF;Python Software Foundation;PostgreSQL;MPL 2.0;MPL-2.0"
          --ignore-packages patio-contratos patio-borda patio-nuvem patio-ferramentas patio-ml

  vulnerabilidades:
    name: falhas de segurança conhecidas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Exportar as dependências travadas, com hash
        run: uv export --frozen --no-emit-workspace --format requirements-txt -o requisitos.txt
      - name: pip-audit
        run: uvx pip-audit@2.10.1 -r requisitos.txt --disable-pip --progress-spinner off

  ambiente:
    name: ambiente local (docker compose)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMPOSE: docker compose -f infra/docker-compose.yml --project-directory .
      PATIO_URL_BANCO: postgresql+pg8000://patio:patio-local@localhost:15432/patio
      # A chave só do ambiente local (a mesma do .env.exemplo); nunca a de produção.
      PATIO_CHAVE_CIFRA: _0_jqx-SW46BKdQoB9mZcMouVAft1Qjf8Pf2niPbThI=
      PATIO_AMBIENTE: local
      PATIO_PASTA_FOTOS: dados/fotos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Instalar o ambiente (exatamente o uv.lock)
        run: uv sync --frozen
      - name: tarefas up
        run: uv run tarefas up
      - name: Os dois bancos respondem
        run: |
          $COMPOSE exec -T postgres psql -U patio -d patio -c "select 1"
          $COMPOSE exec -T postgres-teste psql -U patio -d patio_teste -c "select 1"
      - name: tarefas migrar
        run: uv run tarefas migrar
      - name: tarefas semente (duas vezes; a segunda não muda nada)
        run: |
          uv run tarefas semente
          uv run tarefas semente
      - name: A API responde em /saude
        run: test "$(curl --fail-with-body -sS http://localhost:18000/saude)" = '{"ok":true}'
      - name: O login da demonstração abre a sessão (303 para o início)
        run: >-
          test "$(curl -sS -o /dev/null -w '%{http_code}'
          -d 'email=gestor@empresa-a.example' -d 'senha=demonstracao-local'
          http://localhost:18000/entrar)" = 303
      - name: tarefas down
        run: uv run tarefas down

  imagens-da-caixa:
    name: imagens da caixa
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: A imagem do agente
        run: docker build -f borda/Dockerfile -t patio-caixa:local .
      - name: O agente abre as bibliotecas da caixa, sem root
        run: |
          docker run --rm patio-caixa:local python -c "import cv2, onnxruntime, psutil, borda.caixa"
          test "$(docker run --rm patio-caixa:local id -u)" = 10001
          docker run --rm patio-caixa:local caixa rodar --help
      - name: A imagem do go2rtc (montada do código, sem FFmpeg)
        run: docker build -f infra/caixa/go2rtc.Dockerfile -t patio-go2rtc:local infra/caixa
      - name: O go2rtc recebe uma câmera pela API, só na memória
        run: |
          docker run -d --name go2rtc --read-only -p 127.0.0.1:1984:1984 patio-go2rtc:local
          curl --retry 15 --retry-connrefused --retry-delay 1 -fsS -X PATCH \
            "http://127.0.0.1:1984/api/streams?name=camera-1&src=rtsp://10.0.0.1:554/1"
          curl -fsS http://127.0.0.1:1984/api/streams | grep -q '"camera-1"'
          docker logs go2rtc
          docker rm -f go2rtc
      - name: O compose da caixa
        run: docker compose -f infra/caixa/compose.yml config -q
      - name: A imagem do simulador (o roteiro do piloto, T62)
        run: |
          docker build -f ferramentas/Dockerfile -t patio-simulador:local .
          test "$(docker run --rm --entrypoint id patio-simulador:local -u)" = 10002
          docker run --rm patio-simulador:local --help | grep -q -- "--passagens"
          # Sem rede e sem nada guardado, explica em vez de quebrar (e termina com 1).
          { docker run --rm --network none patio-simulador:local \
              --nuvem https://homologacao.exemplo --passagens amostra || true; } \
            | grep -q "nenhuma caixa ativada"

  producao:
    name: compose da produção (como na homologação)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: O compose da produção lê o .env de exemplo
        run: |
          pasta="$RUNNER_TEMP/patio"
          mkdir -p "$pasta"
          cp infra/producao/compose.yml infra/producao/Caddyfile infra/producao/compose.registros.yml \
            "$pasta/"
          cp infra/producao/env.exemplo "$pasta/.env"
          # Como na máquina: dentro da pasta (o COMPOSE_FILE do .env é relativo a ela).
          cd "$pasta"
          docker compose config -q
          COMPOSE_PROFILES=homologacao docker compose config -q
      - name: A imagem da nuvem, com o nome que o deploy usa
        run: docker build -f nuvem/Dockerfile -t ghcr.io/lorenzo265/patio-nuvem:ci .
      - name: A imagem tem o pg_dump e o pg_restore da versão do servidor (16)
        run: |
          docker run --rm ghcr.io/lorenzo265/patio-nuvem:ci pg_dump --version | grep -q " 16\."
          docker run --rm ghcr.io/lorenzo265/patio-nuvem:ci pg_restore --version | grep -q " 16\."
      - name: Sobe como na homologação (o banco num contêiner, o Caddy no localhost)
        # Valores só desta checagem; a chave é a do ambiente local (.env.exemplo).
        run: |
          cat > "$RUNNER_TEMP/patio/.env" <<'FIM'
          VERSAO=ci
          DOMINIO=localhost
          COMPOSE_PROFILES=homologacao
          POSTGRES_SENHA=homologacao-da-ci
          PATIO_AMBIENTE=homologacao
          PATIO_URL_PUBLICA=https://localhost
          PATIO_CABECALHO_DO_IP=X-Real-IP
          PATIO_URL_BANCO=postgresql+pg8000://patio:homologacao-da-ci@postgres:5432/patio
          PATIO_CHAVE_CIFRA=_0_jqx-SW46BKdQoB9mZcMouVAft1Qjf8Pf2niPbThI=
          PATIO_PASTA_FOTOS=/tmp/fotos
          FIM
          docker compose --project-directory "$RUNNER_TEMP/patio" up -d --wait --wait-timeout 180
      - name: A API responde pelo Caddy, com HTTPS
        run: test "$(curl -fsSk https://localhost/saude)" = '{"ok":true}'
      - name: O worker está de pé e as migrações terminaram bem
        run: |
          cd "$RUNNER_TEMP/patio"
          docker compose ps --status running --services | grep -qx worker
          test "$(docker compose ps -a migracoes --format '{{.ExitCode}}')" = 0
      - name: Os registros, se algo falhou
        if: failure()
        run: docker compose --project-directory "$RUNNER_TEMP/patio" logs --no-color
      - name: Derrubar
        if: always()
        run: docker compose --project-directory "$RUNNER_TEMP/patio" down -v
