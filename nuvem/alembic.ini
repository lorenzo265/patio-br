# Migrações da nuvem (Alembic). A URL do banco não fica aqui: vem de PATIO_URL_BANCO
# (nuvem.config), no ambiente ou no .env.
#
#   uv run tarefas migrar
#       aplica todas as migrações no banco de desenvolvimento
#   uv run alembic -c nuvem/alembic.ini revision --autogenerate --rev-id 0002 -m "o que muda"
#       gera a próxima migração a partir dos modelos (revise sempre o arquivo gerado)

[alembic]
script_location = %(here)s/migracoes
file_template = %%(rev)s_%%(slug)s
path_separator = os

[post_write_hooks]
# A migração gerada já sai no padrão do projeto.
hooks = ruff_corrige, ruff_formata
ruff_corrige.type = module
ruff_corrige.module = ruff
ruff_corrige.options = check --fix REVISION_SCRIPT_FILENAME
ruff_formata.type = module
ruff_formata.module = ruff
ruff_formata.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
